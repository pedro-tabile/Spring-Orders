services:
  database:
    image: mysql:9.6
    environment:
      MYSQL_DATABASE: orders
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    # Porta de execução na máquina e no servidor, respectivamente
    ports:
      - "3311:3306"
    # Comando definido para permitir a criação de funções e triggers (o usuário pode não ter privilégio SUPER)
    command: ["--log-bin-trust-function-creators=1"]
    # Volume para o armazenamento de dados persistidos
    volumes:
      - orders:/var/lib/mysql
    # Checagem do clico de vida do servidor
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orders: